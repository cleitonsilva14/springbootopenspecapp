spring.application.name=springbootopenspecapp

# Server
server.port=8000

# Datasource (H2 em memória)
spring.datasource.url=jdbc:h2:mem:catalog;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# Paginação
spring.data.web.pageable.max-page-size=100

# Segurança / JWT (sobrescreva em produção via variáveis de ambiente)
app.security.jwt.secret=${APP_SECURITY_JWT_SECRET:8kT7/QV665dUR0t9M76Qn4tOt3EmjwK6DrGl2sZzQsUX/m0TveM3bbwReqqQPyDD}
app.security.jwt.expiration=${APP_SECURITY_JWT_EXPIRATION:1h}
app.security.user.username=${APP_SECURITY_USER_USERNAME:admin}
app.security.user.password=${APP_SECURITY_USER_PASSWORD:admin123}

# Springdoc
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
